# A change describes itself in changes/<slug>.md and leaves the version to the release
# (changes/README.md). Fails when a note is malformed, or when a pull request has a note
# and also edits version.ts, CHANGELOG.md or the /changelog entries by hand.
name: Change notes

on:
  pull_request:

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the change notes
        run: node web/scripts/release.mjs --check "origin/${{ github.base_ref }}"

      - name: Remind when core code changes without a note
        if: github.repository == 'regen-Tribe/myconet'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -qE '^(web/src|supabase/migrations)/' \
            && ! echo "$changed" | grep -qE '^(changes/.+\.md|CHANGELOG\.md)$'; then
            echo "::warning::This pull request changes the app but has no changes/<slug>.md note, so no release will mention it."
          fi
